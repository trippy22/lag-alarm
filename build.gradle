plugins {
    id 'java'
}

repositories {
    maven {
        url = 'https://repo.runelite.net'
        content { includeGroupByRegex('net\\.runelite.*') }
    }
    mavenCentral()
}

def runeLiteVersion = providers.gradleProperty('runeliteVersion').getOrElse('1.13.1')
group = 'com.lagalarm'
version = '0.1.0'

dependencies {
    compileOnly "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:client:${runeLiteVersion}"
    testImplementation "net.runelite:jshell:${runeLiteVersion}"
    testImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release.set(11)
}

tasks.register('run', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lagalarm.LagAlarmLauncher'
    jvmArgs '-ea'
    args '--developer-mode', '--debug'
}

tasks.named('jar') {
    from('runelite-plugin.properties')
}

tasks.register('renderPreview', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lagalarm.LagAlarmPreview'
    systemProperty 'java.awt.headless', 'true'
    args layout.buildDirectory.dir('preview').get().asFile.absolutePath
}

tasks.register('benchmark', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lagalarm.LagAlarmBenchmark'
    args providers.gradleProperty('benchmarkHost').getOrElse('127.0.0.1'),
        providers.gradleProperty('benchmarkSeconds').getOrElse('30'),
        providers.gradleProperty('probeIntervalMs').getOrElse('500'),
        providers.gradleProperty('probeDeadlineMs').getOrElse('600'),
        providers.gradleProperty('benchmarkOutput').getOrElse(layout.buildDirectory.dir('benchmark').get().asFile.absolutePath),
        providers.gradleProperty('benchmarkPolicy').getOrElse('automatic')
}

tasks.register('simulate', JavaExec) {
    classpath = sourceSets.test.runtimeClasspath
    mainClass = 'com.lagalarm.LagAlarmSimulation'
    args layout.buildDirectory.dir('benchmark').get().asFile.absolutePath
}
